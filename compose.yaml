# EC2에서 `docker compose up -d --build`로 셋을 함께 띄운다.
#   db    : PostgreSQL. 데이터는 db-data 볼륨에 남아서 컨테이너를 다시 만들어도 지워지지 않는다
#   app   : 틈타 서버(Spring Boot). 밖으로 포트를 열지 않고 caddy만 붙는다
#   caddy : HTTPS 앞단. 인증서(Let's Encrypt)를 자동으로 받고 갱신해서 app으로 넘긴다
# 비밀번호와 도메인은 같은 폴더의 .env에서 읽는다(.env.example 참고, 저장소에 올리지 않는다)
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: teumta
      POSTGRES_USER: ${DATABASE_USERNAME}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      # DB가 연결을 받을 수 있을 때까지 app을 띄우지 않는다 ($$는 compose가 아니라 컨테이너 안에서 값을 읽게 한다)
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d teumta"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 256m

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DATABASE_URL: jdbc:postgresql://db:5432/teumta
      DATABASE_USERNAME: ${DATABASE_USERNAME}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
    healthcheck:
      # 시드를 다 넣고 요청을 받을 준비가 됐는지 (/actuator/health/readiness가 200이면 준비됨)
      test: ["CMD-SHELL", "curl -fs http://localhost:8080/actuator/health/readiness || exit 1"]
      interval: 10s
      timeout: 3s
      start_period: 60s
      retries: 6
    mem_limit: 640m

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # 받은 인증서를 남겨 둔다. 지우면 다시 받는데, Let's Encrypt는 너무 자주 받으면 막는다
      - caddy-data:/data
      - caddy-config:/config
    mem_limit: 192m

volumes:
  db-data:
  caddy-data:
  caddy-config:
